<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>선생님용 과목 관리 · 내신 시뮬레이터</title>
  <link rel="stylesheet" href="./styles.css?v=20260918-shared-position1" />
</head>
<body>
  <main class="teacher-shell">
    <header class="teacher-header">
      <div><p class="eyebrow">배정고 학업 설계 도구</p><h1>선생님용 과목 관리</h1><p class="muted">입학생 연도와 학기별로 과목을 확인하고, 학생 화면에 표시할 개설 과목을 관리합니다.</p></div>
      <a class="secondary-button teacher-back" href="./index.html">학생 페이지로 돌아가기</a>
    </header>
    <section class="teacher-panel teacher-toolbar">
      <div class="teacher-year-filter"><label>입학생 연도<select id="filter-year" class="input"></select></label></div>
      <div class="teacher-status-filter" role="group" aria-label="개설 상태 필터"><button class="quiet-button is-selected" data-status-filter="all">전체</button><button class="quiet-button" data-status-filter="active">개설</button><button class="quiet-button" data-status-filter="inactive">미개설</button></div>
      <div class="teacher-toolbar-actions"><button id="add-course" class="primary-button">+ 과목 추가</button><button id="reset-catalog" class="quiet-button">기본 목록 복원</button></div>
    </section>
    <section class="teacher-panel teacher-browser-panel">
      <div class="teacher-list-heading"><div><p class="eyebrow">과목 탐색</p><h2>학년·학기별 과목</h2><p id="course-count" class="muted"></p></div><p class="teacher-hint">학기를 누르면 해당 과목만 펼쳐집니다.</p></div>
      <div id="course-browser" class="teacher-browser"></div>
    </section>
    <section id="course-editor" class="teacher-editor" hidden aria-label="과목 편집" role="dialog" aria-modal="true">
      <div class="teacher-editor-card"><div class="teacher-list-heading"><div><p class="eyebrow">과목 정보</p><h2 id="editor-title">과목 추가</h2></div><button id="cancel-edit" class="quiet-button" type="button">닫기</button></div>
        <form id="course-form" class="teacher-form"><input id="course-id" type="hidden" /><label>입학생 연도<input id="course-year" class="input" type="number" min="2022" max="2100" required /></label><label>학년<select id="course-grade" class="input"><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option></select></label><label>학기<select id="course-semester" class="input"><option value="1">1학기</option><option value="2">2학기</option></select></label><label class="teacher-wide">과목명<input id="course-name" class="input" maxlength="80" required /></label><label>교과군<input id="course-group" class="input" maxlength="30" required /></label><label>학점<input id="course-credit" class="input" type="number" min="0.5" max="20" step="0.5" required /></label><label>성적 처리 방식<select id="course-grading" class="input"><option value="grade">등급 산출</option><option value="achievement">성취도</option><option value="passfail">P/F</option><option value="both">등급+성취도</option></select></label><label>공통/선택<select id="course-requirement" class="input"><option value="common">공통</option><option value="elective">선택</option><option value="school-designated">학교 지정</option></select></label><label>표시 순서<input id="course-order" class="input" type="number" min="0" step="1" required /></label><label class="teacher-check"><input id="course-active" type="checkbox" checked /> 개설 과목으로 표시</label><label class="teacher-check"><input id="course-enabled" type="checkbox" checked /> 학생 선택 가능</label><div class="teacher-form-actions"><button type="submit" class="primary-button">저장</button><button type="button" id="cancel-edit-bottom" class="quiet-button">취소</button></div></form>
      </div>
    </section>
    <p id="teacher-toast" class="teacher-toast" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="./src/teacher-app.mjs?v=20260914-teacher-ui3"></script>
</body>
</html>
